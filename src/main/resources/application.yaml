spring:
  application:
    name: game-tracker
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:game_tracker}
    username: ${DB_USER:game_tracker}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
  cloud:
    openfeign:
      client:
        config:
          rawg:
            connect-timeout: 5000
            read-timeout: 5000

rawg:
  base-url: ${RAWG_BASE_URL:https://api.rawg.io/api}
  api-key: ${RAWG_API_KEY}
