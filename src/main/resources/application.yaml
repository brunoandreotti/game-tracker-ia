spring:
  application:
    name: game-tracker
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:game_tracker}
    username: ${DB_USER:game_tracker}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
  http:
    serviceclient:
      rawg:
        base-url: ${RAWG_BASE_URL:https://api.rawg.io/api}
        connect-timeout: 5s
        read-timeout: 5s

rawg:
  api-key: ${RAWG_API_KEY}
